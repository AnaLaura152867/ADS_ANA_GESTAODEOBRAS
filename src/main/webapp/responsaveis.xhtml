<ui:composition template="/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="conteudo">

        <div class="faixa-titulo">
            <h1>Responsáveis</h1>
            <p>Cadastre as pessoas que respondem pelas obras.</p>
        </div>

        <div style="height: 1.25rem;"></div>

        <h:form id="form">
            <p:messages id="mensagens" showDetail="true" closable="true"/>

            <p:panel header="Cadastro de Responsável">

                <div class="campos">

                    <p:outputLabel for="nome" value="Nome"/>
                    <p:inputText id="nome"
                                 value="#{responsavelBean.responsavel.nome}"
                                 required="true"
                                 maxlength="120"
                                 placeholder="Nome completo"/>

                    <p:outputLabel for="cargo" value="Cargo"/>
                    <p:inputText id="cargo"
                                 value="#{responsavelBean.responsavel.cargo}"
                                 required="true"
                                 maxlength="100"
                                 placeholder="Ex.: Engenheiro civil"/>

                    <p:outputLabel for="ativo" value="Situação"/>
                    <p:toggleSwitch id="ativo"
                                    value="#{responsavelBean.responsavel.ativo}"/>

                </div>

                <div class="botoes">
                    <p:commandButton value="Salvar"
                                     icon="pi pi-save"
                                     action="#{responsavelBean.salvar}"
                                     update=":form :formLista"/>

                    <p:commandButton value="Novo / Cancelar"
                                     icon="pi pi-plus"
                                     action="#{responsavelBean.novo}"
                                     process="@this"
                                     update=":form"
                                     resetValues="true"
                                     styleClass="ui-button-secondary"/>
                </div>

            </p:panel>
        </h:form>

        <h:form id="formLista">

            <p:panel header="Responsáveis cadastrados">

                <p:dataTable id="tabela"
                             value="#{responsavelBean.lista}"
                             var="r"
                             rows="10"
                             paginator="true"
                             emptyMessage="Nenhum responsável encontrado.">

                    <p:column headerText="Nome" filterBy="#{r.nome}" filterMatchMode="contains">
                        <h:outputText value="#{r.nome}" style="font-weight:600;"/>
                    </p:column>

                    <p:column headerText="Cargo">
                        <h:outputText value="#{r.cargo}"/>
                    </p:column>

                    <p:column headerText="Situação">
                        <h:outputText value="#{r.situacao}"
                                      styleClass="badge-st #{r.ativo ? 'st-CONCLUIDA' : 'st-CANCELADA'}"/>
                    </p:column>

                    <p:column headerText="Ações">

                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         action="#{responsavelBean.editar(r)}"
                                         process="@this"
                                         update=":form"
                                         resetValues="true"/>

                        <p:commandButton icon="pi pi-trash"
                                         title="Excluir"
                                         action="#{responsavelBean.excluir(r)}"
                                         process="@this"
                                         update=":formLista"
                                         styleClass="ui-button-danger"
                                         style="margin-left: 5px;">

                            <p:confirm header="Confirmação"
                                       message="Deseja excluir este responsável?"
                                       icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>

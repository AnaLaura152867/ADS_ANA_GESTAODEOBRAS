
<ui:composition template="/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="conteudo">

        <h:form id="form">

            <p:messages id="mensagens"
                        showDetail="true"
                        closable="true"/>

            <p:panel header="Cadastro de Etapas">

                <div class="campos">

                    <p:outputLabel for="nome" value="Nome da etapa"/>
                    <p:inputText id="nome"
                                 value="#{etapaBean.etapa.nome}"
                                 required="true"
                                 maxlength="100"/>

                    <p:outputLabel for="descricao" value="Descrição"/>
                    <p:inputTextarea id="descricao"
                                     value="#{etapaBean.etapa.descricao}"
                                     maxlength="500"
                                     rows="3"
                                     autoResize="true"/>

                    <p:outputLabel for="obra" value="Obra vinculada"/>
                    <p:selectOneMenu id="obra"
                                     value="#{etapaBean.etapa.obra}"
                                     required="true"
                                     converter="obraConverter">
                        <f:selectItem itemLabel="Selecione uma obra"
                                      itemValue="#{null}"
                                      noSelectionOption="true"/>
                        <f:selectItems value="#{etapaBean.obras}"
                                       var="o"
                                       itemLabel="#{o.nome}"
                                       itemValue="#{o}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="inicio" value="Data de início"/>
                    <p:datePicker id="inicio"
                                  value="#{etapaBean.etapa.dataInicio}"
                                  pattern="dd/MM/yyyy"/>

                    <p:outputLabel for="termino" value="Data de término"/>
                    <p:datePicker id="termino"
                                  value="#{etapaBean.etapa.dataFim}"
                                  pattern="dd/MM/yyyy"/>

                    <p:outputLabel for="status" value="Status"/>
                    <p:selectOneMenu id="status"
                                     value="#{etapaBean.etapa.status}"
                                     required="true">
                        <f:selectItem itemLabel="Planejada"
                                      itemValue="PLANEJADA"/>
                        <f:selectItem itemLabel="Em andamento"
                                      itemValue="EM_ANDAMENTO"/>
                        <f:selectItem itemLabel="Concluída"
                                      itemValue="CONCLUIDA"/>
                        <f:selectItem itemLabel="Cancelada"
                                      itemValue="CANCELADA"/>
                    </p:selectOneMenu>

                </div>

                <div class="botoes">

                    <p:commandButton value="Salvar"
                                     icon="pi pi-save"
                                     action="#{etapaBean.salvar}"
                                     update=":form :formLista"/>

                    <p:commandButton value="Nova / Cancelar"
                                     icon="pi pi-plus"
                                     action="#{etapaBean.novo}"
                                     process="@this"
                                     update=":form"
                                     resetValues="true"
                                     styleClass="ui-button-secondary"/>

                </div>

            </p:panel>

        </h:form>

        <h:form id="formLista">

            <p:panel header="Etapas cadastradas">

                <div class="busca">

                    <p:inputText id="filtro"
                                 value="#{etapaBean.filtro}"
                                 placeholder="Buscar por nome"/>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{etapaBean.buscar}"
                                     process="@this filtro"
                                     update="tabela"/>

                    <p:commandButton value="Listar todas"
                                     icon="pi pi-list"
                                     action="#{etapaBean.listarTodos}"
                                     process="@this"
                                     update="@form"
                                     styleClass="ui-button-secondary"/>

                </div>

                <p:dataTable id="tabela"
                             value="#{etapaBean.lista}"
                             var="e"
                             rows="10"
                             paginator="true"
                             emptyMessage="Nenhuma etapa encontrada.">

                    <p:column headerText="Etapa">
                        <h:outputText value="#{e.nome}"/>
                    </p:column>

                    <p:column headerText="Descrição">
                        <h:outputText value="#{e.descricao}"/>
                    </p:column>

                    <p:column headerText="Obra">
                        <h:outputText value="#{e.obra.nome}"/>
                    </p:column>

                    <p:column headerText="Data de início">
                        <h:outputText value="#{e.dataInicio}">
                            <f:convertDateTime type="localDate"
                                               pattern="dd/MM/yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Data de término">
                        <h:outputText value="#{e.dataFim}">
                            <f:convertDateTime type="localDate"
                                               pattern="dd/MM/yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Status">
                        <h:outputText value="#{e.status}"/>
                    </p:column>

                    <p:column headerText="Ações">

                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         action="#{etapaBean.editar(e)}"
                                         process="@this"
                                         update=":form"
                                         resetValues="true"/>

                        <p:commandButton icon="pi pi-trash"
                                         title="Excluir"
                                         action="#{etapaBean.excluir(e)}"
                                         process="@this"
                                         update=":formLista"
                                         styleClass="ui-button-danger"
                                         style="margin-left: 5px;">

                            <p:confirm header="Confirmação"
                                       message="Deseja excluir esta etapa?"
                                       icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>

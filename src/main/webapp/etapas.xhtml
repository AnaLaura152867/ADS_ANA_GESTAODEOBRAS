<ui:composition template="/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="conteudo">

        <div class="faixa-titulo">
            <h1>Etapas</h1>
            <p>Etapas de execução que podem ser atribuídas às obras.</p>
        </div>

        <div style="height: 1.25rem;"></div>

        <h:form id="form">
            <p:messages id="mensagens" showDetail="true" closable="true"/>

            <p:panel header="Cadastro de Etapa">

                <div class="campos">

                    <p:outputLabel for="nome" value="Nome da etapa"/>
                    <p:inputText id="nome"
                                 value="#{etapaBean.etapa.nome}"
                                 required="true"
                                 maxlength="60"
                                 placeholder="Ex.: Em planejamento"/>

                </div>

                <div class="botoes">
                    <p:commandButton value="Salvar"
                                     icon="pi pi-save"
                                     action="#{etapaBean.salvar}"
                                     update=":form :formLista"/>

                    <p:commandButton value="Nova / Cancelar"
                                     icon="pi pi-plus"
                                     action="#{etapaBean.novo}"
                                     process="@this"
                                     update=":form"
                                     resetValues="true"
                                     styleClass="ui-button-secondary"/>
                </div>

            </p:panel>
        </h:form>

        <h:form id="formLista">

            <p:panel header="Etapas cadastradas">

                <p:dataTable id="tabela"
                             value="#{etapaBean.lista}"
                             var="e"
                             rows="10"
                             paginator="true"
                             emptyMessage="Nenhuma etapa cadastrada ainda.">

                    <p:column headerText="Etapa">
                        <h:outputText value="#{e.nome}" style="font-weight:600;"/>
                    </p:column>

                    <p:column headerText="Ações">

                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         action="#{etapaBean.editar(e)}"
                                         process="@this"
                                         update=":form"
                                         resetValues="true"/>

                        <p:commandButton icon="pi pi-trash"
                                         title="Excluir"
                                         action="#{etapaBean.excluir(e)}"
                                         process="@this"
                                         update=":formLista"
                                         styleClass="ui-button-danger"
                                         style="margin-left: 5px;">

                            <p:confirm header="Confirmação"
                                       message="Deseja excluir esta etapa?"
                                       icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>

<ui:composition template="/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="conteudo">
        <div class="hero">
            <span class="selo"><i class="pi pi-building"></i></span>
            <div>
                <h1>Olá, #{loginBean.usuarioLogado.nome}!</h1>
                <p>Bem-vindo(a) ao sistema de acompanhamento e controle de obras.</p>
            </div>
        </div>
        <div class="cards-painel">
            <div class="card-painel">
                <span class="icone verde"><i class="pi pi-building"></i></span>
                <h3>Obras</h3>
                <p>Cadastro e consulta de obras.</p>
                <p:button value="Acessar obras" outcome="/obras" icon="pi pi-arrow-right" iconPos="right"/>
            </div>
            <div class="card-painel">
                <span class="icone rosa"><i class="pi pi-users"></i></span>
                <h3>Responsáveis</h3>
                <p>Cadastro dos responsáveis pelas obras.</p>
                <p:button value="Acessar responsáveis" outcome="/responsaveis" icon="pi pi-arrow-right" iconPos="right"/>
            </div>
            <div class="card-painel">
                <span class="icone azul"><i class="pi pi-list-check"></i></span>
                <h3>Etapas</h3>
                <p>Acompanhamento das etapas de execução.</p>
                <p:button value="Acessar etapas" outcome="/etapas" icon="pi pi-arrow-right" iconPos="right"/>
            </div>
        </div>
    </ui:define>
</ui:composition>

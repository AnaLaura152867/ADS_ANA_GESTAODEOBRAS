<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Gestão de Obras</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="css" name="tema.css"/>
</h:head>
<h:body>
    <h:form id="menuForm">
        <p:menubar>
            <p:menuitem value="Início" outcome="/index" icon="pi pi-home"/>
            <p:menuitem value="Obras" outcome="/obras" icon="pi pi-building"/>
            <p:menuitem value="Responsáveis" outcome="/responsaveis" icon="pi pi-users"/>
            <p:menuitem value="Etapas" outcome="/etapas" icon="pi pi-list-check"/>
            <f:facet name="options">
                <h:outputText value="#{loginBean.usuarioLogado.nome} (#{loginBean.usuarioLogado.perfil.descricao})" style="margin-right: 1rem;"/>
                <p:commandButton value="Sair" icon="pi pi-sign-out" action="#{loginBean.sair}" ajax="false" styleClass="btn-sair"/>
            </f:facet>
        </p:menubar>
    </h:form>
    <p:growl autoUpdate="true" showDetail="true" life="4000"/>
    <h:form id="confirmForm">
        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
        </p:confirmDialog>
    </h:form>
    <div class="conteudo">
        <ui:insert name="conteudo"/>
    </div>
    <div class="rodape">Gestão de Obras · Sistema interno de acompanhamento</div>
</h:body>
</html>

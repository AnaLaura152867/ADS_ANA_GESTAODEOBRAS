<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Gestão de Obras</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body { margin: 0; background: #f4f6f8; }
        .conteudo { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
        .conteudo .ui-panel { margin-bottom: 1rem; }
        .campos { display: grid; grid-template-columns: 180px 1fr; gap: .75rem 1rem; align-items: center; }
        .botoes { margin-top: 1rem; }
        .botoes .ui-button { margin-right: .5rem; }
        .busca { margin-bottom: 1rem; }
        .busca .ui-inputfield, .busca .ui-button { margin-right: .5rem; }
        .atrasada { color: #b71c1c; font-weight: bold; }
    </style>
</h:head>

<h:body>
    <!--
        TEMPLATE MANHATTAN: substitua este cabeçalho/menu pelo layout do Manhattan
        usado em sala (copie os arquivos do template para src/main/webapp e ajuste
        este arquivo). As páginas só dependem do ui:insert name="conteudo".
    -->
    <h:form id="menuForm">
        <p:menubar>
            <p:menuitem value="Início" outcome="/index" icon="pi pi-home"/>
            <p:menuitem value="Obras" outcome="/obras" icon="pi pi-building"/>
            <f:facet name="options">
                <h:outputText value="#{loginBean.usuarioLogado.nome} (#{loginBean.usuarioLogado.perfil.descricao})"
                              style="margin-right: 1rem;"/>
                <p:commandButton value="Sair" icon="pi pi-sign-out" action="#{loginBean.sair}" ajax="false"/>
            </f:facet>
        </p:menubar>
    </h:form>

    <p:growl autoUpdate="true" showDetail="true" life="4000"/>

    <h:form id="confirmForm">
        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
        </p:confirmDialog>
    </h:form>

    <div class="conteudo">
        <ui:insert name="conteudo"/>
    </div>
</h:body>
</html>

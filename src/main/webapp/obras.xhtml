
<ui:composition template="/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="conteudo">

        <h:form id="form">
            <p:messages id="mensagens" showDetail="true" closable="true"/>

            <p:panel header="Cadastro de Obras">

                <div class="campos">

                    <p:outputLabel for="nome" value="Nome da obra"/>
                    <p:inputText id="nome"
                                 value="#{obraBean.obra.nome}"
                                 required="true"
                                 maxlength="150"/>

                    <p:outputLabel for="endereco" value="Endereço"/>
                    <p:inputText id="endereco"
                                 value="#{obraBean.obra.endereco}"
                                 required="true"
                                 maxlength="255"/>

                    <p:outputLabel for="inicio" value="Data de início"/>
                    <p:datePicker id="inicio"
                                  value="#{obraBean.obra.dataInicio}"
                                  pattern="dd/MM/yyyy"
                                  required="true"/>

                    <p:outputLabel for="termino" value="Previsão de término"/>
                    <p:datePicker id="termino"
                                  value="#{obraBean.obra.previsaoTermino}"
                                  pattern="dd/MM/yyyy"
                                  required="true"/>

                    <p:outputLabel for="orcamento" value="Orçamento"/>
                    <p:inputNumber id="orcamento"
                                   value="#{obraBean.obra.orcamento}"
                                   symbol="R$ "
                                   decimalSeparator=","
                                   thousandSeparator="."
                                   decimalPlaces="2"
                                   required="true"/>

                    <p:outputLabel for="status" value="Status"/>
                    <p:selectOneMenu id="status"
                                     value="#{obraBean.obra.status}"
                                     required="true">
                        <f:selectItems value="#{obraBean.statusLista}"
                                       var="s"
                                       itemLabel="#{s.descricao}"
                                       itemValue="#{s}"/>
                    </p:selectOneMenu>

                </div>

                <div class="botoes">
                    <p:commandButton value="Salvar"
                                     icon="pi pi-save"
                                     action="#{obraBean.salvar}"
                                     update=":form :formLista"/>

                    <p:commandButton value="Nova / Cancelar"
                                     icon="pi pi-plus"
                                     action="#{obraBean.novo}"
                                     process="@this"
                                     update=":form"
                                     resetValues="true"
                                     styleClass="ui-button-secondary"/>
                </div>

            </p:panel>
        </h:form>

        <h:form id="formLista">

            <p:panel header="Obras cadastradas">

                <div class="busca">

                    <p:inputText id="filtro"
                                 value="#{obraBean.filtro}"
                                 placeholder="Buscar por nome"/>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{obraBean.buscar}"
                                     process="@this filtro"
                                     update="tabela"/>

                    <p:commandButton value="Listar todas"
                                     icon="pi pi-list"
                                     action="#{obraBean.listarTodos}"
                                     process="@this"
                                     update="@form"
                                     styleClass="ui-button-secondary"/>

                </div>

                <p:dataTable id="tabela"
                             value="#{obraBean.lista}"
                             var="o"
                             rows="10"
                             paginator="true"
                             emptyMessage="Nenhuma obra encontrada.">

                    <p:column headerText="Nome">
                        <h:outputText value="#{o.nome}"/>
                    </p:column>

                    <p:column headerText="Endereço">
                        <h:outputText value="#{o.endereco}"/>
                    </p:column>

                    <p:column headerText="Início">
                        <h:outputText value="#{o.dataInicio}">
                            <f:convertDateTime pattern="dd/MM/yyyy"
                                               timeZone="America/Sao_Paulo"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Previsão de término">
                        <h:outputText value="#{o.previsaoTermino}">
                            <f:convertDateTime pattern="dd/MM/yyyy"
                                               timeZone="America/Sao_Paulo"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Orçamento">
                        <h:outputText value="#{o.orcamento}">
                            <f:convertNumber type="currency"
                                             currencySymbol="R$ "
                                             locale="pt_BR"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Status">
                        <h:outputText value="#{o.status.descricao}"/>
                    </p:column>

                    <p:column headerText="Ações">

                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         action="#{obraBean.editar(o)}"
                                         process="@this"
                                         update=":form"
                                         resetValues="true"/>

                        <p:commandButton icon="pi pi-trash"
                                         title="Excluir"
                                         action="#{obraBean.excluir(o)}"
                                         process="@this"
                                         update=":formLista"
                                         styleClass="ui-button-danger"
                                         style="margin-left: 5px;">

                            <p:confirm header="Confirmação"
                                       message="Deseja excluir esta obra?"
                                       icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>

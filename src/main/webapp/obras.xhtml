<ui:composition template="/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="conteudo">

        <div class="faixa-titulo">
            <h1>Obras</h1>
            <p>Cadastre uma nova obra e acompanhe as obras já registradas.</p>
        </div>

        <div style="height: 1.25rem;"></div>

        <h:form id="form">
            <p:messages id="mensagens" showDetail="true" closable="true"/>

            <p:panel header="Cadastrar Nova Obra">

                <div class="campos">

                    <p:outputLabel for="nome" value="Nome da obra"/>
                    <p:inputText id="nome"
                                 value="#{obraBean.obra.nome}"
                                 required="true"
                                 maxlength="150"/>

                    <p:outputLabel for="endereco" value="Loja"/>
                    <p:inputText id="endereco"
                                 value="#{obraBean.obra.endereco}"
                                 required="true"
                                 maxlength="255"/>

                    <p:outputLabel for="responsavel" value="Responsável"/>
                    <p:selectOneMenu id="responsavel"
                                     value="#{obraBean.obra.responsavel}"
                                     required="true"
                                     requiredMessage="Selecione um responsável já cadastrado.">
                        <f:selectItem itemLabel="Selecione um responsável" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{obraBean.responsaveis}"
                                       var="r"
                                       itemLabel="#{r.nome} - #{r.cargo}"
                                       itemValue="#{r}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="etapa" value="Etapa"/>
                    <p:selectOneMenu id="etapa"
                                     value="#{obraBean.obra.etapa}"
                                     required="true"
                                     requiredMessage="Selecione a etapa.">
                        <f:selectItem itemLabel="Selecione a etapa" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{obraBean.etapas}"
                                       var="e"
                                       itemLabel="#{e.nome}"
                                       itemValue="#{e}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="inicio" value="Data de início"/>
                    <p:datePicker id="inicio"
                                  value="#{obraBean.obra.dataInicio}"
                                  pattern="dd/MM/yyyy"
                                  required="true"/>

                    <p:outputLabel for="termino" value="Previsão de entrega"/>
                    <p:datePicker id="termino"
                                  value="#{obraBean.obra.previsaoTermino}"
                                  pattern="dd/MM/yyyy"
                                  required="true"/>

                    <p:outputLabel for="orcamento" value="Orçamento"/>
                    <p:inputNumber id="orcamento"
                                   value="#{obraBean.obra.orcamento}"
                                   symbol="R$ "
                                   decimalSeparator=","
                                   thousandSeparator="."
                                   decimalPlaces="2"
                                   required="true"/>

                    <p:outputLabel for="status" value="Status"/>
                    <p:selectOneMenu id="status"
                                     value="#{obraBean.obra.status}"
                                     required="true">
                        <f:selectItems value="#{obraBean.statusLista}"
                                       var="s"
                                       itemLabel="#{s.descricao}"
                                       itemValue="#{s}"/>
                    </p:selectOneMenu>
                    
                </div>

                <div class="botoes">
                    <p:commandButton value="Salvar"
                                     icon="pi pi-save"
                                     action="#{obraBean.salvar}"
                                     update=":form :formLista"/>

                    <p:commandButton value="Nova / Cancelar"
                                     icon="pi pi-plus"
                                     action="#{obraBean.novo}"
                                     process="@this"
                                     update=":form"
                                     resetValues="true"
                                     styleClass="ui-button-secondary"/>
                </div>

            </p:panel>
        </h:form>

        <h:form id="formLista">

            <p:panel header="Obras cadastradas">

                <div class="busca">

                    <p:inputText id="filtro"
                                 value="#{obraBean.filtro}"
                                 placeholder="Buscar por nome"/>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     action="#{obraBean.buscar}"
                                     process="@this filtro"
                                     update="tabela"/>

                    <p:commandButton value="Listar todas"
                                     icon="pi pi-list"
                                     action="#{obraBean.listarTodos}"
                                     process="@this"
                                     update="@form"
                                     styleClass="ui-button-secondary"/>

                </div>

                <p:dataTable id="tabela"
                             value="#{obraBean.lista}"
                             var="o"
                             rows="10"
                             paginator="true"
                             emptyMessage="Nenhuma obra encontrada.">

                    <p:column headerText="Obra">
                        <h:outputText value="#{o.nome}" style="font-weight:600;"/>
                    </p:column>

                    <p:column headerText="Início">
                        <h:outputText value="#{o.dataInicio}">
                            <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Previsão de entrega">
                        <h:outputText value="#{o.previsaoTermino}">
                            <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Status">
                        <h:outputText value="#{o.status.descricao}"
                                      styleClass="badge-st st-#{o.status}"/>
                    </p:column>

                    <p:column headerText="Ações">

                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         action="#{obraBean.editar(o)}"
                                         process="@this"
                                         update=":form"
                                         resetValues="true"/>

                        <p:commandButton icon="pi pi-trash"
                                         title="Excluir"
                                         action="#{obraBean.excluir(o)}"
                                         process="@this"
                                         update=":formLista"
                                         styleClass="ui-button-danger"
                                         style="margin-left: 5px;">

                            <p:confirm header="Confirmação"
                                       message="Deseja excluir esta obra?"
                                       icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Gestão de Obras - Acesso</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="css" name="tema.css"/>
    <h:outputStylesheet library="css" name="login.css"/>
</h:head>
<h:body styleClass="pagina-login">
    <div class="login-card">
        <span class="login-selo"><i class="pi pi-lock"></i></span>
        <h1>Sistema de Gestão de Obras</h1>
        <p class="login-sub">TÓPICOS E DESENVOLVIMENTO DE SISTEMAS</p>
        <h:form id="formLogin">
            <p:messages id="msg" closable="true"/>
            <label class="login-label" for="formLogin:usuario">USUÁRIO</label>
            <div class="login-campo">
                <i class="pi pi-user"></i>
                <p:inputText id="usuario" value="#{loginBean.login}" required="true"
                             requiredMessage="Informe o usuário." placeholder="Digite seu usuário"/>
            </div>
            <label class="login-label" for="formLogin:senha">SENHA</label>
            <div class="login-campo">
                <i class="pi pi-lock"></i>
                <p:password id="senha" value="#{loginBean.senha}" feedback="false" required="true"
                            requiredMessage="Informe a senha." placeholder="Digite sua senha"/>
            </div>
            <p:commandButton value="Entrar" icon="pi pi-sign-in" action="#{loginBean.entrar}"
                             ajax="false" styleClass="login-entrar"/>
        </h:form>
    </div>
</h:body>
</html>

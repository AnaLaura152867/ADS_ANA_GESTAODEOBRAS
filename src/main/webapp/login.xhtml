<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Login - Gestão de Obras</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body { margin: 0; background: #f4f6f8; display: flex; justify-content: center; padding-top: 12vh; }
        .caixa { width: 340px; }
        .campos { display: grid; gap: .75rem; }
        .campos .ui-inputfield { width: 100%; box-sizing: border-box; }
    </style>
</h:head>

<h:body>
    <p:growl autoUpdate="true" showDetail="true" life="4000"/>

    <div class="caixa">
        <h:form id="formLogin">
            <p:panel header="Gestão de Obras - Acesso">
                <div class="campos">
                    <p:outputLabel for="login" value="Login"/>
                    <p:inputText id="login" value="#{loginBean.login}" required="true"
                                 requiredMessage="Informe o login"/>

                    <p:outputLabel for="senha" value="Senha"/>
                    <p:password id="senha" value="#{loginBean.senha}" required="true"
                                requiredMessage="Informe a senha" feedback="false"/>

                    <p:commandButton value="Entrar" icon="pi pi-sign-in" action="#{loginBean.entrar}"
                                     ajax="false"/>
                </div>
            </p:panel>
        </h:form>
    </div>
</h:body>
</html>

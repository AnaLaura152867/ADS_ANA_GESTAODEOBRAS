<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Gestão de Obras | Cadastro de Responsável</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #263445;
        }

        header {
            background: #183b65;
            color: white;
            padding: 22px 35px;
        }

        header h1 { margin: 0 0 8px; }
        header p { margin: 0; color: #d9e5f2; }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            padding: 15px 35px;
            background: white;
        }

        nav a {
            color: #183b65;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 22px;
        }

        .titulo { margin-bottom: 22px; }
        .titulo p { color: #68778a; }

        .painel {
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0000000d;
        }

        .campos {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .completo { grid-column: 1 / -1; }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 6px;
            font: inherit;
            background: white;
        }

        .acoes {
            display: flex;
            gap: 12px;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .botao {
            display: inline-block;
            padding: 12px 19px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .principal {
            background: #183b65;
            color: white;
        }

        .voltar {
            background: #e8edf3;
            color: #263445;
        }

        .mensagem {
            margin-bottom: 18px;
            color: #c0392b;
        }

        @media (max-width: 650px) {
            .campos { grid-template-columns: 1fr; }
            .completo { grid-column: auto; }
        }
    </style>
</h:head>

<h:body>

    <header>
        <h1>Gestão de Obras</h1>
        <p>Sistema de acompanhamento e controle de obras</p>
    </header>

    <nav>
        <a href="index.xhtml">Painel inicial</a>
        <a href="obras.xhtml">Obras</a>
        <a href="responsaveis.xhtml">Responsáveis</a>
        <a href="etapas.xhtml">Etapas</a>
    </nav>

    <main>

        <div class="titulo">
            <h2>Cadastro de responsável</h2>
            <p>Registre os profissionais responsáveis pela execução das obras.</p>
        </div>

        <section class="painel">

            <h3>Dados do profissional</h3>

            <h:form id="formResponsavel">

                <h:messages styleClass="mensagem"
                            infoStyle="color: green;"
                            errorStyle="color: red;"/>

                <div class="campos">

                    <div class="campo completo">
                        <label for="nome">Nome completo *</label>

                        <h:inputText id="nome"
                                     value="#{responsavelBean.responsavel.nome}"
                                     required="true"
                                     maxlength="120"
                                     requiredMessage="Informe o nome completo."/>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>

                        <h:inputText id="cpf"
                                     value="#{responsavelBean.responsavel.cpf}"
                                     maxlength="14"/>
                    </div>

                    <div class="campo">
                        <label for="cargo">Cargo *</label>

                        <h:selectOneMenu id="cargo"
                                         value="#{responsavelBean.responsavel.cargo}"
                                         required="true"
                                         requiredMessage="Selecione o cargo.">

                            <f:selectItem itemLabel="Selecione..."
                                          itemValue=""
                                          noSelectionOption="true"/>

                            <f:selectItem itemLabel="Engenheiro civil"
                                          itemValue="ENGENHEIRO"/>

                            <f:selectItem itemLabel="Arquiteto"
                                          itemValue="ARQUITETO"/>

                            <f:selectItem itemLabel="Mestre de obras"
                                          itemValue="MESTRE"/>

                            <f:selectItem itemLabel="Supervisor"
                                          itemValue="SUPERVISOR"/>

                            <f:selectItem itemLabel="Outro"
                                          itemValue="OUTRO"/>

                        </h:selectOneMenu>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail *</label>

                        <h:inputText id="email"
                                     value="#{responsavelBean.responsavel.email}"
                                     required="true"
                                     maxlength="120"
                                     requiredMessage="Informe o e-mail."/>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>

                        <h:inputText id="telefone"
                                     value="#{responsavelBean.responsavel.telefone}"
                                     maxlength="20"/>
                    </div>

                    <div class="campo">
                        <label for="status">Situação</label>

                        <h:selectOneMenu id="status"
                                         value="#{responsavelBean.responsavel.status}">

                            <f:selectItem itemLabel="Ativo"
                                          itemValue="ATIVO"/>

                            <f:selectItem itemLabel="Inativo"
                                          itemValue="INATIVO"/>

                        </h:selectOneMenu>
                    </div>

                    <div class="campo completo">
                        <label for="observacoes">Observações</label>

                        <h:inputText id="observacoes"
                                     value="#{responsavelBean.responsavel.observacoes}"
                                     maxlength="250"/>
                    </div>

                </div>

                <div class="acoes">

                    <h:commandButton value="Salvar responsável"
                                     action="#{responsavelBean.salvar}"
                                     styleClass="botao principal"/>

                    <h:button value="Cancelar"
                              outcome="responsaveis.xhtml"
                              styleClass="botao voltar"/>

                </div>

            </h:form>

        </section>

    </main>

</h:body>
</html>
